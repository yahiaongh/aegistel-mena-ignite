name: keep-aegistel-awake

# NOTE: GitHub's cron dispatcher is unreliable on low-traffic public repos
# (scheduled runs can be delayed by hours), so this file is a best-effort
# backup ONLY. The RELIABLE keepalive is an external free monitor pinging
# https://<service>.onrender.com/api/health every ~5-10 min (e.g. cron-job.org
# or UptimeRobot) — the ping must come from OUTSIDE the sleeping app.
# Set the repo VARIABLE `AEGISTEL_URL` (Settings -> Secrets and variables ->
# Actions -> Variables) to your deployed URL, e.g.
#   https://aegistel.onrender.com
# Without it the job no-ops, so the repo stays deploy-safe before you deploy.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AegisTel health endpoint
        env:
          APP_URL: ${{ vars.AEGISTEL_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::AEGISTEL_URL repo variable not set; keepalive disabled."
            exit 0
          fi
          # `|| true`: a spinning-up/cold-starting instance is expected during
          # deploy; the request itself counts as activity, not a red alarm.
          curl -fsS -A "aegistel-keepalive/1.0" --max-time 90 \
            "$APP_URL/api/health" >/dev/null || true