[pytest]
# Suppress third-party deprecation noise that is NOT actionable from this repo.
#
# - crewai (1.15.x) internally deprecates `function_calling_llm`,
#   `allow_code_execution`, `reasoning`, and `multimodal` attributes. We do NOT
#   pass any of those params from our code (verified), so these warnings are
#   purely library-internal and would otherwise flood every audit test.
# - starlette's TestClient raises StarletteDeprecationWarning that `httpx` is
#   deprecated in favor of `httpx2`. That is a test-tooling note, not a defect
#   in AegisTel.
# - A memory test imports torch transitively (via crewai/langchain), which
#   deprecates `torch.jit.script` in favour of `torch.compile`/`export`. That is
#   library-internal and unrelated to AegisTel code.
#
# Filters are scoped to those exact third-party categories/namespaces so any
# warning raised from AegisTel's own modules still surfaces.
filterwarnings =
    ignore::DeprecationWarning:crewai
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore::DeprecationWarning:torch.jit._script
